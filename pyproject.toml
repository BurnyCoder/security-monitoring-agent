[project]
name = "security-monitoring-agent"
version = "0.1.0"
description = "Local Windows and WSL vulnerability monitoring with Codex and Claude Code"
readme = "README.md"
authors = [
    { name = "Libor Burian" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.161.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "portalocker>=4.4.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
security-monitoring-agent = "security_monitoring_agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
docs = [
    "pymupdf>=2.0",
    "reportlab>=5.1.0",
]
